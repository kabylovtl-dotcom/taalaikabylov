<style>
:root{
  /* layout: the world fills the screen; one quiet panel (right on desktop, bottom on phone) appears when called. Single dusk theme. */
  color-scheme: dark;
  --dusk:#0d1222;
  --glass:rgba(13,17,30,.68);
  --ink:#eceef6;
  --ink-dim:#a4a9bd;
  --lamp:#f0b06a;
  --paper:#efeadf;
  --line:rgba(236,238,246,.16);
  --display:"Prata","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Golos Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--dusk);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font-family:inherit}
#stage{position:absolute;inset:0;background:linear-gradient(#1a2444 0%,#3b3f63 55%,#8f6f66 100%)}
#gl{display:block;width:100%;height:100%;touch-action:none;outline:none}
#marks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
body:not(.in) #marks{visibility:hidden}   /* no numbered markers over the entry screen */
.mk{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;color:var(--ink);font:500 11px/1 var(--body);font-variant-numeric:tabular-nums;will-change:transform,opacity}
.mk i{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:1px solid rgba(236,238,246,.8);background:rgba(13,17,30,.38);display:flex;align-items:center;justify-content:center;font-style:normal}
.mk.sub i{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:rgba(236,238,246,.22)}
.mk[aria-current="true"] i{border-color:var(--lamp);color:var(--lamp)}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#tip{position:absolute;left:0;top:0;padding:4px 9px;border-radius:6px;background:var(--glass);font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* panel */
#panel{position:absolute;left:0;right:0;bottom:0;max-height:40%;display:flex;flex-direction:column;gap:8px;padding:14px 18px;background:var(--glass);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#panel.has-photo{max-height:58%}
#count{font-size:11px;letter-spacing:.14em;color:var(--lamp);font-variant-numeric:tabular-nums;font-variant-caps:all-small-caps;min-height:14px}
#title{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2;margin:0;text-wrap:balance;padding-right:44px}
#text{flex:1 1 auto;min-height:44px;overflow-y:auto;font-size:15px;line-height:1.5;max-width:60ch}
#text p{margin:0 0 .6em}
#text p:last-child{margin-bottom:0}
.nav{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.nav button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px var(--body);cursor:pointer}
.nav #next{border-color:rgba(240,176,106,.6);color:var(--lamp)}
.nav button:disabled{opacity:.35;cursor:default}
#close{position:absolute;right:8px;top:6px;width:44px;height:44px;border:0;background:none;color:var(--ink-dim);font-size:22px;line-height:1;cursor:pointer}
#panel.shut{flex-direction:row;align-items:center;gap:12px;padding:8px 14px;max-height:none}
#panel.shut #title,#panel.shut #text,#panel.shut #close,#panel.shut #shots{display:none}
#panel.shut #count{flex:0 0 auto;min-width:56px}
#panel.shut .nav{flex:1}

/* photos as archive prints */
#shots{flex:0 0 auto;position:relative}
#strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0}
#strip::-webkit-scrollbar{display:none}
.shot{flex:0 0 100%;scroll-snap-align:center;margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.shot button{display:block;padding:5px;border:0;background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.45);cursor:zoom-in;line-height:0}
.shot img,.shot video{display:block;width:100%;height:100%;object-fit:cover;background:#2a2d3a}
.shot figcaption{font-size:11px;letter-spacing:.1em;font-variant-caps:all-small-caps;color:var(--ink-dim);text-align:center;line-height:1.3}
.shot.empty button{background:none;box-shadow:none;border:1px dashed var(--ink-dim);cursor:default;color:var(--ink-dim);font:12px/1.4 var(--body);display:flex;align-items:center;justify-content:center;padding:8px;text-align:center}
#dots{display:flex;justify-content:center;gap:2px;margin-top:2px}
#dots button{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer}
#dots button::after{content:"";display:block;width:6px;height:6px;margin:auto;border-radius:50%;background:var(--ink-dim);opacity:.5}
#dots button[aria-current="true"]::after{background:var(--lamp);opacity:1}
.arrow{position:absolute;top:calc(50% - 34px);width:44px;height:44px;border:0;border-radius:22px;background:var(--glass);color:var(--ink);font-size:20px;cursor:pointer;display:none}
.arrow.l{left:-6px}.arrow.r{right:-6px}

/* entry screen */
#intro{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:flex-start;padding:28px 22px;background:linear-gradient(to top,rgba(9,12,24,.92) 0%,rgba(9,12,24,.62) 45%,rgba(9,12,24,.25) 100%);transition:opacity .6s}
#intro.gone{opacity:0;pointer-events:none}
#intro .in{max-width:34rem;display:flex;flex-direction:column;gap:12px}
#intro h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,58px);line-height:1.05;margin:0;text-wrap:balance}
#intro .tag{font-family:var(--display);font-size:clamp(17px,3.2vw,22px);color:var(--lamp);margin:0}
#intro p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
#intro .own{color:var(--ink);font-size:16px}
#intro .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#intro .btns>*{height:48px;min-width:132px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:rgba(13,17,30,.5);color:var(--ink);font:500 15px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
#intro #enter{background:var(--lamp);border-color:var(--lamp);color:#1b1408;font-weight:600}
#intro #enter:disabled{opacity:.45;cursor:default}
#load{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.14em;font-variant-caps:all-small-caps;color:var(--ink-dim);min-height:16px}
#load .bar{flex:0 0 140px;height:2px;background:var(--line);overflow:hidden}
#load .bar b{display:block;height:100%;width:100%;background:var(--lamp);transform-origin:left;transform:scaleX(0);transition:transform .25s}
#intro .credit{font-size:12px;color:var(--ink-dim);line-height:1.45;margin-top:4px}
#slow{position:absolute;left:14px;top:14px;z-index:4;max-width:min(320px,70%);padding:10px 14px;border-radius:10px;background:var(--glass);border:1px solid var(--line);color:var(--ink);font-size:13px;line-height:1.4;text-decoration:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#slow u{color:var(--lamp)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:20;background:rgba(6,8,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 12px 20px;touch-action:pan-y}
#lb img,#lb video{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border:6px solid var(--paper);box-shadow:0 6px 30px rgba(0,0,0,.6)}
#lb p{margin:0;font-size:12px;letter-spacing:.1em;font-variant-caps:all-small-caps;color:var(--ink-dim);text-align:center;min-height:16px}
#lb button{position:absolute;width:48px;height:48px;border:0;border-radius:24px;background:rgba(236,238,246,.1);color:var(--ink);font-size:22px;cursor:pointer}
#lbx{right:10px;top:8px}#lbp{left:8px;top:calc(50% - 24px)}#lbn{right:8px;top:calc(50% - 24px)}
#dbg{position:absolute;left:8px;bottom:8px;z-index:30;padding:6px 8px;background:rgba(0,0,0,.6);color:#bfe7c8;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none}
[hidden]{display:none!important}
body.shot #panel,body.shot #intro,body.shot #marks,body.shot #slow{display:none!important}
@media (min-width:860px){
  #panel,#panel.has-photo{left:auto;right:20px;top:72px;bottom:auto;width:380px;max-height:calc(100% - 100px);border:1px solid var(--line);border-radius:14px;padding:26px 26px 20px;gap:12px}
  #title{font-size:27px}
  #panel.shut{top:auto;bottom:20px;width:300px;padding:10px 12px}
  #intro{padding:56px 64px}
  .arrow{display:block}
}
@media (prefers-reduced-motion:reduce){#tip,#intro,#load .bar b{transition:none}#strip{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" tabindex="0"></canvas>
  <div id="marks"></div>
  <div id="tip" role="tooltip"></div>
</div>
<a id="slow" href="text.html" hidden></a>

<section id="panel" class="shut" aria-live="polite" hidden>
  <button id="close" type="button">×</button>
  <div id="count"></div>
  <h2 id="title"></h2>
  <div id="shots" hidden>
    <div id="strip"></div>
    <button class="arrow l" id="shl" type="button">‹</button>
    <button class="arrow r" id="shr" type="button">›</button>
    <div id="dots"></div>
  </div>
  <div id="text"></div>
  <div class="nav">
    <button id="prev" type="button"></button>
    <button id="next" type="button"></button>
  </div>
</section>

<div id="intro">
  <div class="in">
    <h1 id="iname">Taalai Kabylov</h1>
    <p class="tag" id="itag">A workshop without walls</p>
    <p id="ihow"></p>
    <p class="own" id="iown" hidden></p>
    <div class="btns">
      <button id="enter" type="button" disabled>Enter</button>
      <a id="totext" href="text.html">Text version</a>
    </div>
    <div id="load"><span class="bar"><b id="bar"></b></span><span id="stagename"></span></div>
    <p class="credit" id="icredit"></p>
  </div>
</div>

<div id="lb" role="dialog" aria-modal="true" hidden>
  <button id="lbx" type="button">×</button>
  <button id="lbp" type="button">‹</button>
  <img id="lbi" alt="">
  <video id="lbv" controls loop playsinline hidden></video>
  <p id="lbc"></p>
  <button id="lbn" type="button">›</button>
</div>
<div id="dbg" hidden></div>

<script src="data.js"></script>
<script src="js/terrain.js"></script>
<script src="js/ui.js"></script>
<script type="module" src="js/world.js"></script>
</body>
